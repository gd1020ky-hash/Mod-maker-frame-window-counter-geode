name: Build Android Geode Mod

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compile Android Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Ninja Build Tool
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.11.1

      # 讓 Geode 官方官方專屬 Action 自動接管 Android SDK/NDK 下載與配置，防範路徑遺失
      - name: Build the Geode Mod Package
        uses: geode-sdk/build-geode-mod@main
        with:
          # 僅針對 Android 的 64 位元與 32 位元架構進行交叉編譯
          targets: android64 android32
          combine: true
          
