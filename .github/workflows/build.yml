name: Build Android Geode Mod

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compile Android Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Ninja Build Tool
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.11.1

      - name: Build the Geode Mod Package
        uses: geode-sdk/build-geode-mod@main
        with:
          targets: android64 android32
          combine: true
          
